
name: Build Brow OS ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y \
            live-build debootstrap xorriso squashfs-tools \
            mtools dosfstools isolinux syslinux-common \
            grub-pc-bin grub-efi-amd64-bin ca-certificates \
            curl wget git sudo

      - name: Verify Brow OS build configuration
        run: |
          echo "=== Commit ==="
          git rev-parse HEAD
          echo "=== Debian release ==="
          cat /etc/os-release
          echo "=== Live-build version ==="
          lb --version
          echo "=== Live-build configuration ==="
          cat image/auto/config
          echo "=== Firmware package list ==="
          cat image/config/package-lists/firmware.list.chroot
          echo "=== Package lists ==="
          find image/config/package-lists -maxdepth 1 -type f -print

      - name: Validate project scripts
        run: |
          bash -n host-tools/build.sh
          sh host-tools/validate.sh

      - name: Build Brow OS
        run: |
          chmod +x host-tools/build.sh
          bash host-tools/build.sh

      - name: List generated files
        run: |
          ls -lah image/

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: brow-os-iso
          path: |
            image/*.iso
            image/*.sha256
            image/build.log
          if-no-files-found: error
