name: Build Brow OS ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    container:
      image: debian:trixie
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y \
            live-build \
            debootstrap \
            xorriso \
            squashfs-tools \
            mtools \
            dosfstools \
            isolinux \
            syslinux-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            ca-certificates \
            curl \
            wget \
            git \
            sudo

      - name: Build Brow OS
        run: |
          chmod +x host-tools/build.sh
          sh host-tools/build.sh

      - name: List generated files
        run: |
          echo "=== image directory ==="
          ls -lah image/

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: brow-os-iso
          path: |
            image/*.iso
            image/*.sha256
            image/build.log
          if-no-files-found: error
