name: Build Brow OS ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools mtools dosfstools \
            isolinux syslinux-common grub-pc-bin grub-efi-amd64-bin \
            ca-certificates curl wget git sudo

      - name: Build Brow OS ISO
        run: |
          set -euo pipefail
          chmod +x image/auto/config host-tools/build.sh
          bash -n host-tools/build.sh
          bash -n host-tools/write-usb.sh
          sh host-tools/validate.sh
          bash host-tools/build.sh
          test -n "$(find image -maxdepth 1 -type f -name '*.iso' -print -quit)"
          for iso in image/*.iso; do
            test -f "$iso.sha256"
            # The checksum lists the ISO basename relative to image/.
            # Validate from that directory so the entry resolves correctly.
            (
              cd image
              sha256sum -c "$(basename "$iso").sha256"
            )
          done

      - name: Upload verified ISO
        uses: actions/upload-artifact@v4
        with:
          name: brow-os-iso
          path: |
            image/*.iso
            image/*.iso.sha256
            image/build.log
          if-no-files-found: error
          retention-days: 14
